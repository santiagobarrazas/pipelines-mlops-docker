<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Predicción de enfermedad</title>
  <style>
    :root { --azul: #2f6db3; --borde: #d0d7e2; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Helvetica, Arial, sans-serif; background: #f3f6fa; color: #222; }
    main { max-width: 520px; margin: 40px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid var(--borde); border-radius: 12px; padding: 24px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: #555; font-size: .92rem; }
    label { display: block; font-weight: 600; margin: 14px 0 4px; font-size: .95rem; }
    label small { font-weight: 400; color: #666; }
    input { width: 100%; padding: 9px 10px; font-size: 1rem; border: 1px solid var(--borde); border-radius: 8px; }
    button { margin-top: 20px; width: 100%; padding: 11px; font-size: 1rem; font-weight: 600;
             background: var(--azul); color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    .resultado { margin-top: 20px; padding: 16px; border-radius: 10px; text-align: center; font-size: 1.25rem; font-weight: 700; }
    .resultado small { display: block; font-size: .85rem; font-weight: 400; margin-top: 4px; }
    .NO-ENFERMO { background: #e3f5e6; color: #1f6b2e; }
    .ENFERMEDAD-LEVE { background: #fff6d6; color: #7a5b00; }
    .ENFERMEDAD-AGUDA { background: #fde3e1; color: #a12a1f; }
    .ENFERMEDAD-CRÓNICA { background: #ece3f8; color: #5b2d91; }
    .error { margin-top: 20px; padding: 12px; border-radius: 8px; background: #fde3e1; color: #a12a1f; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Predicción de enfermedad</h1>
    <p class="sub">Ingrese los síntomas del paciente para obtener el estado estimado.</p>
    <form method="post">
      <label for="temperatura">Temperatura <small>(°C, {{ rangos.temperatura[0] }} a {{ rangos.temperatura[1] }})</small></label>
      <input id="temperatura" name="temperatura" type="number" step="0.1" required
             min="{{ rangos.temperatura[0] }}" max="{{ rangos.temperatura[1] }}" value="{{ valores.get('temperatura', '') }}">

      <label for="frecuencia_cardiaca">Frecuencia cardíaca <small>(lpm, {{ rangos.frecuencia_cardiaca[0] }} a {{ rangos.frecuencia_cardiaca[1] }})</small></label>
      <input id="frecuencia_cardiaca" name="frecuencia_cardiaca" type="number" step="1" required
             min="{{ rangos.frecuencia_cardiaca[0] }}" max="{{ rangos.frecuencia_cardiaca[1] }}" value="{{ valores.get('frecuencia_cardiaca', '') }}">

      <label for="dolor">Intensidad del dolor <small>(0 = sin dolor, 10 = máximo)</small></label>
      <input id="dolor" name="dolor" type="number" step="1" required
             min="{{ rangos.dolor[0] }}" max="{{ rangos.dolor[1] }}" value="{{ valores.get('dolor', '') }}">

      <label for="dias_sintomas">Días con síntomas <small>(0 a {{ rangos.dias_sintomas[1] }})</small></label>
      <input id="dias_sintomas" name="dias_sintomas" type="number" step="1" required
             min="{{ rangos.dias_sintomas[0] }}" max="{{ rangos.dias_sintomas[1] }}" value="{{ valores.get('dias_sintomas', '') }}">

      <button type="submit">Predecir</button>
    </form>

    {% if resultado %}
      <div class="resultado {{ resultado.estado | replace(' ', '-') }}">
        {{ resultado.estado }}
        <small>Puntaje de severidad: {{ resultado.puntaje }} / 8</small>
      </div>
    {% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </div>
</main>
</body>
</html>
